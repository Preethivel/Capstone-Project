services:
  - type: web
    name: learnverse-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: ADMIN_EMAIL
        value: admin@learnverse.com