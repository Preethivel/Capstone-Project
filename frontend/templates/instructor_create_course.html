{% extends "base.html" %}

{% block content %}
<div style="max-width:700px; margin:100px auto; padding:40px; background:#fff; border-radius:12px; border:1px solid #E2E8F0; box-shadow:0 4px 20px rgba(0,0,0,0.05);">
    <h2 style="color:#0F172A; margin-bottom:8px;">📝 Create New Course</h2>
    <p style="color:#64748B; margin-bottom:25px;">Share your knowledge with the world!</p>
    
    <form method="POST" action="/instructor/course/create">
        <div style="margin-bottom:15px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Course Title</label>
            <input type="text" name="title" required placeholder="e.g., Python for Data Science" style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
        </div>
        
        <div style="margin-bottom:15px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Description</label>
            <textarea name="description" rows="4" required placeholder="Describe what students will learn..." style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px; font-family:inherit;"></textarea>
        </div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px;">
            <div>
                <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Domain</label>
                <select name="domain" required style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
                    <option value="Programming">💻 Programming</option>
                    <option value="Web Development">🌐 Web Development</option>
                    <option value="AI & ML">🤖 AI & ML</option>
                    <option value="Data Science">📊 Data Science</option>
                    <option value="Cybersecurity">🔒 Cybersecurity</option>
                    <option value="Cloud Computing">☁️ Cloud Computing</option>
                    <option value="DevOps">🔄 DevOps</option>
                    <option value="Mobile Development">📱 Mobile Development</option>
                </select>
            </div>
            <div>
                <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Level</label>
                <select name="level" required style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
                    <option value="Beginner">🔰 Beginner</option>
                    <option value="Intermediate">📈 Intermediate</option>
                    <option value="Advanced">🚀 Advanced</option>
                </select>
            </div>
        </div>
        
        <div style="margin-bottom:20px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Price (₹)</label>
            <input type="number" name="price" step="0.01" min="0" value="0" placeholder="0 for free" style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
        </div>
        
        <div style="display:flex; gap:10px;">
            <button type="submit" style="flex:1; padding:14px; background:#2563EB; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer;">Create Course</button>
            <a href="/instructor/dashboard" style="flex:1; padding:14px; background:#F8FAFC; color:#64748B; border:1px solid #E2E8F0; border-radius:10px; text-align:center; text-decoration:none; font-size:16px; font-weight:600;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
