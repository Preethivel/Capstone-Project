<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnVerse - Edit Course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="logo">Learn<span>Verse</span></div>
        <nav>
            <a href="/">Home</a>
            <a href="/courses">Courses</a>
            <a href="/admin/courses">Admin</a>
            <a href="#" class="btn-signin">Sign In</a>
        </nav>
    </header>

    <div class="container">
        <h1>✏️ Edit Course</h1>
        
        <form method="POST" class="course-form">
            <div class="form-group">
                <label>Course Title</label>
                <input type="text" name="title" value="{{ course.title }}" required>
            </div>
            
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="4" required>{{ course.description }}</textarea>
            </div>
            
            <div class="form-group">
                <label>Domain</label>
                <select name="domain" required>
                    <option value="Python" {% if course.domain == 'Python' %}selected{% endif %}>Python</option>
                    <option value="AI/ML" {% if course.domain == 'AI/ML' %}selected{% endif %}>AI/ML</option>
                    <option value="Web Dev" {% if course.domain == 'Web Dev' %}selected{% endif %}>Web Dev</option>
                    <option value="Data Science" {% if course.domain == 'Data Science' %}selected{% endif %}>Data Science</option>
                    <option value="Cloud" {% if course.domain == 'Cloud' %}selected{% endif %}>Cloud</option>
                    <option value="DevOps" {% if course.domain == 'DevOps' %}selected{% endif %}>DevOps</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Level</label>
                <select name="level" required>
                    <option value="Beginner" {% if course.level == 'Beginner' %}selected{% endif %}>Beginner</option>
                    <option value="Intermediate" {% if course.level == 'Intermediate' %}selected{% endif %}>Intermediate</option>
                    <option value="Advanced" {% if course.level == 'Advanced' %}selected{% endif %}>Advanced</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" step="0.01" value="{{ course.price }}" required>
            </div>
            
            <div class="form-group">
                <label>Instructor</label>
                <input type="text" name="instructor" value="{{ course.instructor }}" required>
            </div>
            
            <div style="display:flex; gap:15px; margin-top:20px;">
                <button type="submit" class="btn-primary">Update Course</button>
                <a href="/admin/courses" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <footer>
        <p>© 2026 LearnVerse. Built with 💜 by AI&DS Students</p>
    </footer>

</body>
</html>
