{% extends "base.html" %}

{% block content %}
<div style="max-width:500px; margin:100px auto; padding:40px; background:#fff; border-radius:12px; border:1px solid #E2E8F0; box-shadow:0 4px 20px rgba(0,0,0,0.05);">
    <h2 style="color:#0F172A; text-align:center; margin-bottom:8px;">🚀 Create Account</h2>
    <p style="color:#64748B; text-align:center; margin-bottom:25px;">Choose your role and start learning!</p>
    
    <form method="POST" action="/signup" autocomplete="off">
        <div style="margin-bottom:15px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Full Name</label>
            <input type="text" name="name" required placeholder="Enter your full name" style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
        </div>
        
        <div style="margin-bottom:15px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Email Address</label>
            <input type="email" name="email" required placeholder="Enter your email" autocomplete="off" style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
        </div>
        
        <div style="margin-bottom:15px; position:relative;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Password</label>
            <div style="display:flex; align-items:center; background:#F8FAFC; border-radius:10px; border:1px solid #E2E8F0; padding:0 12px;">
                <input type="password" id="signupPassword" name="password" required placeholder="Min 6 characters" autocomplete="new-password" style="flex:1; padding:12px 0; border:none; background:transparent; font-size:15px; outline:none; color:#0F172A;">
                <span onclick="togglePassword('signupPassword', this)" style="cursor:pointer; font-size:18px; color:#94A3B8; user-select:none;">👁️</span>
            </div>
        </div>
        
        <div style="margin-bottom:15px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">I want to be a...</label>
            <select name="role" id="roleSelect" onchange="toggleInstructorFields()" style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
                <option value="learner">🎓 Learner - I want to learn</option>
                <option value="instructor">👨‍🏫 Instructor - I want to teach</option>
            </select>
        </div>
        
        <div id="instructorFields" style="display:none;">
            <div style="margin-bottom:15px;">
                <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Organization/Company</label>
                <input type="text" name="organization" placeholder="e.g., Google, Microsoft, Self" style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
            </div>
            <div style="margin-bottom:15px;">
                <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Your Title/Role</label>
                <input type="text" name="title" placeholder="e.g., Senior Developer, Data Scientist" style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
            </div>
            <div style="margin-bottom:15px;">
                <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Bio / About You</label>
                <textarea name="bio" rows="2" placeholder="Tell students about yourself..." style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px; font-family:inherit;"></textarea>
            </div>
        </div>
        
        <button type="submit" style="width:100%; padding:14px; background:#2563EB; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer;">Create Account</button>
    </form>
    
    <p style="text-align:center; margin-top:18px; color:#64748B; font-size:14px;">
        Already have an account? <a href="/login" style="color:#2563EB; font-weight:600;">Sign In</a>
    </p>
</div>

<script>
function togglePassword(inputId, eyeIcon) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.textContent = '🙈';
    } else {
        input.type = 'password';
        eyeIcon.textContent = '👁️';
    }
}

function toggleInstructorFields() {
    const role = document.getElementById('roleSelect').value;
    const fields = document.getElementById('instructorFields');
    if (role === 'instructor') {
        fields.style.display = 'block';
    } else {
        fields.style.display = 'none';
    }
}
</script>
{% endblock %}
