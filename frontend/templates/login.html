{% extends "base.html" %}

{% block content %}
<div style="max-width:420px; margin:100px auto; padding:40px; background:#fff; border-radius:12px; border:1px solid #E2E8F0; box-shadow:0 4px 20px rgba(0,0,0,0.05);">
    <h2 style="color:#0F172A; text-align:center; margin-bottom:8px;">👋 Welcome Back</h2>
    <p style="color:#64748B; text-align:center; margin-bottom:25px;">Login to continue learning</p>
    
    <form method="POST" action="/login">
        <div style="margin-bottom:15px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Email Address</label>
            <input type="email" name="email" required placeholder="you@example.com" style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
        </div>
        
        <div style="margin-bottom:20px; position:relative;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Password</label>
            <div style="display:flex; align-items:center; background:#F8FAFC; border-radius:10px; border:1px solid #E2E8F0; padding:0 12px;">
                <input type="password" id="loginPassword" name="password" required placeholder="Enter your password" style="flex:1; padding:12px 0; border:none; background:transparent; font-size:15px; outline:none; color:#0F172A;">
                <span onclick="togglePassword('loginPassword', this)" style="cursor:pointer; font-size:18px; color:#94A3B8; user-select:none;">👁️</span>
            </div>
        </div>
        
        <button type="submit" style="width:100%; padding:14px; background:#2563EB; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer;">Sign In</button>
    </form>
    
    <p style="text-align:center; margin-top:18px; color:#64748B; font-size:14px;">
        Don't have an account? <a href="/signup" style="color:#2563EB; font-weight:600;">Create Account</a>
    </p>
</div>

<script>
function togglePassword(inputId, eyeIcon) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.textContent = '🙈';
    } else {
        input.type = 'password';
        eyeIcon.textContent = '👁️';
    }
}
</script>
{% endblock %}
