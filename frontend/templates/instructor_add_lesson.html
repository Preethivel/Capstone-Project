{% extends "base.html" %}

{% block content %}
<div style="max-width:600px; margin:100px auto; padding:40px; background:#fff; border-radius:12px; border:1px solid #E2E8F0; box-shadow:0 4px 20px rgba(0,0,0,0.05);">
    <h2 style="color:#0F172A; margin-bottom:8px;">📖 Add Lesson to "{{ module.title }}"</h2>
    <p style="color:#64748B; margin-bottom:25px;">Add content to this module.</p>
    
    <form method="POST">
        <div style="margin-bottom:15px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Lesson Title</label>
            <input type="text" name="title" required placeholder="e.g., Variables and Data Types" style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
        </div>
        
        <div style="margin-bottom:15px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Description</label>
            <textarea name="description" rows="2" placeholder="Brief description of the lesson" style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px; font-family:inherit;"></textarea>
        </div>
        
        <div style="margin-bottom:15px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Video URL (YouTube or external)</label>
            <input type="url" name="video_url" placeholder="https://www.youtube.com/watch?v=..." style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px;">
        </div>
        
        <div style="margin-bottom:20px;">
            <label style="display:block; color:#0F172A; font-weight:600; margin-bottom:5px; font-size:14px;">Text Content (Optional)</label>
            <textarea name="content" rows="4" placeholder="Write the lesson content here..." style="width:100%; padding:12px 16px; border-radius:10px; border:1px solid #E2E8F0; background:#F8FAFC; font-size:15px; font-family:inherit;"></textarea>
        </div>
        
        <div style="display:flex; gap:10px;">
            <button type="submit" style="flex:1; padding:14px; background:#2563EB; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer;">Add Lesson</button>
            <a href="/instructor/course/{{ course.id }}" style="flex:1; padding:14px; background:#F8FAFC; color:#64748B; border:1px solid #E2E8F0; border-radius:10px; text-align:center; text-decoration:none; font-size:16px; font-weight:600;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
